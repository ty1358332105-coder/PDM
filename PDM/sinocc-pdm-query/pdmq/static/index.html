<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SinoCC PDM 查询工具</title>
<link rel="stylesheet" href="/static/app.css" />
</head>
<body>

<!-- ======================= 顶栏 ======================= -->
<header class="appbar">
  <div class="brand">
    <span class="brand-mark">PDM</span>
    <span class="brand-text">查询工具</span>
    <span class="brand-ver" id="app-ver">v1.0</span>
  </div>

  <div class="appbar-center">
    <span class="crumb" id="crumb">流程查询</span>
  </div>

  <div class="appbar-right">
    <button class="login-pill" id="login-pill" title="点击查看登录详情 / 切换登录方式">
      <span class="dot" id="login-dot"></span>
      <span id="login-text">未登录</span>
    </button>
    <button class="ghost-btn" id="btn-relogin" title="重新自动登录（从本机 SinoCC 客户端接管登录态）">自动登录</button>
    <button class="ghost-btn" id="btn-login-more" title="密码登录 / 粘贴 loginguid">更多登录方式</button>
    <button class="ghost-btn" id="btn-quit" title="停止后台服务并退出程序">退出</button>
  </div>
</header>

<!-- ======================= 主体 ======================= -->
<div class="shell">

  <!-- 左侧功能栏 -->
  <nav class="rail">
    <div class="rail-group">
      <div class="rail-title">查询</div>
      <button class="rail-item active" data-mode="rels">
        <span class="ri-icon">🧭</span>
        <span class="ri-body">
          <span class="ri-name">流程查询</span>
          <span class="ri-sub">多层明细 + 在途确认单 / 变更单</span>
        </span>
      </button>
      <button class="rail-item" data-mode="samconfirms">
        <span class="ri-icon">🧾</span>
        <span class="ri-body">
          <span class="ri-name">确认单查询</span>
          <span class="ri-sub">采购件 P/OP · TC/SC + 供应商</span>
        </span>
      </button>
    </div>

    <div class="rail-group rail-history">
      <div class="rail-title">最近查询
        <button class="tiny-btn" id="btn-clear-history" title="清空历史">清空</button>
      </div>
      <div id="history-list" class="history-list"></div>
    </div>

    <div class="rail-foot">
      <div id="meta-line" class="meta-line">—</div>
    </div>
  </nav>

  <!-- 右侧工作区 -->
  <main class="work">

    <!-- 查询条件条 -->
    <section class="querybar">
      <div class="qb-field">
        <label for="q-code">物料编码</label>
        <input id="q-code" placeholder="整机 / 物料编码，如 814042400004" autocomplete="off" spellcheck="false" />
      </div>
      <div class="qb-field qb-small">
        <label for="q-layer">层级</label>
        <select id="q-layer">
          <option value="1">1 层</option>
          <option value="2">2 层</option>
          <option value="3">3 层</option>
          <option value="5" selected>5 层</option>
          <option value="0">全部</option>
        </select>
      </div>
      <div class="qb-field qb-small">
        <label for="q-months">时间窗</label>
        <select id="q-months">
          <option value="0">不限</option>
          <option value="6" selected>最近 6 月</option>
          <option value="9">最近 9 月</option>
          <option value="12">最近 12 月</option>
          <option value="18">最近 18 月</option>
          <option value="24">最近 24 月</option>
          <option value="36">最近 36 月</option>
        </select>
      </div>
      <button class="primary-btn" id="btn-run">开始查询</button>
      <button class="ghost-btn" id="btn-stop" style="display:none;">停止</button>
      <button class="ghost-btn" id="btn-back" style="display:none;" title="返回上一层物料">← 返回上一层</button>
      <div class="qb-hint" id="qb-hint"></div>
    </section>

    <!-- 进度区 -->
    <section class="progress-wrap" id="progress-wrap" style="display:none;">
      <div class="progress-top">
        <div class="stages" id="stages"></div>
        <div class="progress-right">
          <span id="pg-pct" class="pg-pct">0%</span>
          <span id="pg-counter">0 / 0</span>
          <span id="pg-eta"></span>
        </div>
      </div>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
      <div class="progress-msg"><span id="pg-stage">准备中</span><span id="pg-msg" class="dim"></span></div>
      <div class="progress-log" id="progress-log"></div>
    </section>

    <!-- 结果区 -->
    <section class="result" id="result">
      <div class="toolbar" id="result-toolbar" style="display:none;">
        <div class="tb-info" id="tb-info"></div>
        <label class="chk" id="tb-onlychk-wrap" style="display:none;">
          <input type="checkbox" id="tb-onlychk" checked /> <span id="tb-onlychk-label">只看在途流程</span>
        </label>
        <label class="chk" id="tb-miss-wrap" style="display:none;" title="只显示一张 TC/SC 都没有的采购件（时间窗按物料受控时间算，窗外物料本身已不显示）">
          <input type="checkbox" id="tb-miss" /> <span style="color:#c0392b;">只看缺确认</span>
        </label>
        <input id="tb-search" class="tb-search" placeholder="🔍 搜索所有列…" />
        <span class="tb-count" id="tb-count"></span>
        <button class="chip-btn" id="tb-clear">✕ 清除筛选</button>
        <button class="chip-btn accent" id="tb-export">⬇ 导出 EXCEL</button>
      </div>
      <div class="table-host" id="table-host">
        <div class="empty">
          <div class="empty-icon">🔎</div>
          <div class="empty-title">先登录，再输入物料编码查询</div>
          <div class="empty-sub">流程查询：多层 BOM + 每行物料在途的样品确认单 / 变更单<br/>
            确认单查询：多层 BOM + 每行物料全部确认单（TC 临时 / SC 正式，含供应商）</div>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- ======================= 登录面板 ======================= -->
<div class="overlay" id="login-overlay" style="display:none;">
  <div class="panel login-panel">
    <div class="panel-head">
      <b>登录</b>
      <button class="x-btn" data-close="login-overlay">×</button>
    </div>
    <div class="panel-body">
      <div class="login-status-line" id="login-status-line">—</div>

      <div class="seg">
        <button class="seg-btn active" data-login-tab="auto">自动登录</button>
        <button class="seg-btn" data-login-tab="pwd">密码登录</button>
        <button class="seg-btn" data-login-tab="uid">粘贴 loginguid</button>
      </div>

      <div class="login-tab" data-login-body="auto">
        <p class="tip">从本机已登录的 <b>SinoCC 客户端</b> 进程内存中接管登录态（免密码）。
          请先打开 PDM 客户端并登录，再点下面按钮。</p>
        <button class="primary-btn" id="btn-auto-login">立即自动登录</button>
      </div>

      <div class="login-tab" data-login-body="pwd" style="display:none;">
        <p class="tip">客户端未运行时可用密码直登（若提示 50012，请改用自动登录）。</p>
        <div class="form-row"><label>账号</label><input id="in-account" placeholder="如：唐阳" /></div>
        <div class="form-row"><label>密码</label><input id="in-password" type="password" /></div>
        <button class="primary-btn" id="btn-pwd-login">登录</button>
      </div>

      <div class="login-tab" data-login-body="uid" style="display:none;">
        <p class="tip">粘贴形如 <code>CHIGOPDM.a.{GUID}.xxxxuacpc</code> 的 loginguid。</p>
        <div class="form-row"><label>loginguid</label><input id="in-uid" placeholder="CHIGOPDM.a.{...}" /></div>
        <button class="primary-btn" id="btn-uid-login">注入登录态</button>
      </div>

      <div class="login-msg" id="login-msg"></div>
    </div>
  </div>
</div>

<!-- ======================= 对象详情弹窗 ======================= -->
<div class="overlay" id="obj-overlay" style="display:none;">
  <div class="panel obj-panel">
    <div class="panel-head">
      <span class="obj-kind" id="obj-kind">确认单</span>
      <b id="obj-title">—</b>
      <button class="x-btn" data-close="obj-overlay">×</button>
    </div>
    <div class="panel-body" id="obj-body"></div>
  </div>
</div>

<!-- ======================= 物料属性弹窗 ======================= -->
<div class="overlay" id="item-overlay" style="display:none;">
  <div class="panel item-panel">
    <div class="panel-head"><span class="obj-kind">物料</span><b id="item-title">—</b>
      <button class="x-btn" data-close="item-overlay">×</button></div>
    <div class="panel-body" id="item-body"></div>
  </div>
</div>

<!-- ======================= 列筛选浮层 ======================= -->
<div class="colmenu" id="colmenu" style="display:none;"></div>

<!-- ======================= 行右键菜单 ======================= -->
<div class="rowmenu" id="rowmenu" style="display:none;"></div>

<!-- ======================= Toast ======================= -->
<div class="toast-host" id="toast-host"></div>

<script src="/static/app.js"></script>
</body>
</html>
